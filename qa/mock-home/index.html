<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home mock: session cards</title>
<!-- Static mock only (not the app). Shows Home with the session card art from web/public/art/. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Shantell+Sans:wght@400;600&display=swap">
<style>
:root { --paper:#fbf8f1; --grid:#e6e0d2; --ink:#1b2340; --ink-soft:#4a5170; --pencil:#85827a; --marker:#ffd84d; --card:#fff; --radius:14px; }
* { box-sizing: border-box; }
body { margin:0; font-family:'Atkinson Hyperlegible Next',system-ui,sans-serif; color:var(--ink); background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px); background-size:24px 24px; }
.wrap { max-width:880px; margin:0 auto; padding:20px 16px 40px; }
.logo { font-weight:800; font-size:1.25rem; letter-spacing:-.02em; margin-bottom:20px; }
.sheet { background:var(--card); border:2px solid var(--ink); border-radius:var(--radius); box-shadow:4px 4px 0 var(--ink); padding:24px; }
h1 { font-family:'Bricolage Grotesque',system-ui,sans-serif; font-weight:800; font-size:2rem; line-height:1.05; margin:0 0 8px; }
.concept { color:var(--ink-soft); margin:0; }
.cards { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:22px; }
.card { display:flex; flex-direction:column; text-align:left; padding:0; border:2px solid var(--ink); border-radius:var(--radius);
  background:var(--card); box-shadow:3px 3px 0 var(--ink); overflow:hidden; cursor:pointer; font:inherit; color:inherit; }
.card:hover { transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--ink); }
.card img { width:100%; aspect-ratio:1; display:block; border-bottom:2px solid var(--ink); background:var(--paper); }
.card .t { font-weight:700; font-size:1.05rem; padding:12px 14px 2px; }
.card .b { color:var(--ink-soft); padding:0 14px 14px; font-size:.95rem; }
.card .go { margin:auto 14px 14px; font-family:'Shantell Sans',cursive; font-size:.9rem; background:linear-gradient(transparent 55%,var(--marker) 55%); align-self:flex-start; }
@media (max-width:640px) {
  .cards { grid-template-columns:1fr; }
  .card { flex-direction:row; align-items:center; }
  .card img { width:120px; flex:none; border-bottom:0; border-right:2px solid var(--ink); }
  .card .go { display:none; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">mm</div>
  <div class="sheet">
    <h1>Bet on your gut. Then watch reality.</h1>
    <p class="concept">Predict first, lock it in, and see exactly where your intuition breaks.</p>
    <div class="cards">
      <button class="card"><img src="../../web/public/art/session-coin-streak-512.webp" alt="">
        <div><div class="t">Coin streaks</div><div class="b">How long is the longest run in 100 flips?</div></div><span class="go">flip it &rarr;</span></button>
      <button class="card"><img src="../../web/public/art/session-positive-test-512.webp" alt="">
        <div><div class="t">The positive test</div><div class="b">You tested positive. How worried should you be?</div></div><span class="go">sort the crowd &rarr;</span></button>
      <button class="card"><img src="../../web/public/art/session-birthday-512.webp" alt="">
        <div><div class="t">The birthday problem</div><div class="b">How many people until two share a birthday?</div></div><span class="go">fill the room &rarr;</span></button>
    </div>
  </div>
</div>
</body>
</html>
