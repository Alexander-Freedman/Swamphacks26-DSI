<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coin C5 mockup</title>
<!-- Low-fi mockup (static). Numbers are from a real simulation: 10,000 rounds of 100 fair flips; see docs/experience.md. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&family=Shantell+Sans:wght@400;600;800&display=swap" rel="stylesheet"><style>
:root{--paper:#fbf8f1;--grid:#e6e0d2;--ink:#1b2340;--ink-soft:#4a5170;--pencil:#85827a;--marker:#ffd84d;--marker-soft:rgba(255,216,77,.55);
--called:#1f8a4c;--close:#c77d00;--off:#c2362f;--card:#fff;--font-body:'Atkinson Hyperlegible Next',system-ui,sans-serif;--font-hand:'Shantell Sans','Comic Neue',cursive;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:var(--font-body);color:var(--ink);background-color:var(--paper);
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.hand{font-family:var(--font-hand)}
.screen{max-width:390px;margin:0 auto;padding:18px 16px 28px;display:flex;flex-direction:column;gap:14px;min-height:100vh}
.top{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--ink-soft)}
.top b{font-family:var(--font-hand);font-weight:800;color:var(--ink);font-size:15px}
.dots{display:flex;gap:5px}.dots i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ink);display:block}.dots i.on{background:var(--ink)}
h1{font-family:var(--font-hand);font-weight:800;font-size:26px;line-height:1.15;margin:4px 0 0}
h1 .mk{background:linear-gradient(transparent 55%,var(--marker) 55%,var(--marker) 92%,transparent 92%);padding:0 3px}
.sub{margin:0;color:var(--ink-soft);font-size:15px;line-height:1.4}
.card{background:var(--card);border:2px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink);padding:12px 14px}
.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
.lbl.pencil{color:var(--pencil)}.lbl.ink{color:var(--ink)}
.lbl .r{font-family:var(--font-hand);text-transform:none;letter-spacing:0;font-size:14px}
.num{font-family:var(--font-hand);font-weight:800;line-height:1}
.tally{display:flex;gap:10px}
.tally>div{flex:1;border-radius:12px;padding:10px 12px;border:2px solid var(--ink);background:var(--card)}
.tally .p{border:2px dashed var(--pencil);color:var(--pencil);background:transparent}
.tally .num{font-size:44px}.tally small{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.btn{display:block;width:100%;text-align:center;font-family:var(--font-hand);font-weight:800;font-size:18px;padding:13px;border-radius:14px;border:2px solid var(--ink);background:var(--marker);box-shadow:0 3px 0 var(--ink);color:var(--ink)}
.btn.ghost{background:var(--card)}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.note{font-size:14px;line-height:1.45;color:var(--ink-soft);margin:0}
.note b{color:var(--ink)}
.hl{background:var(--marker-soft);padding:0 3px;border-radius:3px}
.stamp{display:inline-block;font-family:var(--font-hand);font-weight:800;text-transform:uppercase;letter-spacing:.06em;border:4px double currentColor;border-radius:10px;padding:6px 14px;transform:rotate(-8deg);filter:url(#rough)}
.stamp.off{color:var(--off)}.stamp.called{color:var(--called)}.stamp.close{color:var(--close)}
.chip{font-size:13px;border:2px solid var(--ink);border-radius:999px;padding:6px 11px;background:var(--card)}
.chip.on{background:var(--ink);color:var(--paper)}
.only-desk{display:none}.deskc2>.col{display:flex;flex-direction:column;gap:14px}.deskc2>.col+.col{margin-top:14px}
svg text{font-family:var(--font-body)}
svg .h{font-family:var(--font-hand)}
@media (min-width:900px){
 .screen{max-width:1080px;padding:28px 40px}
 .only-phone{display:none}.only-desk{display:block}
 h1{font-size:34px}
 .desk2{display:grid;grid-template-columns:1.5fr 1fr;gap:22px;align-items:start}
 .desk2 > .col{display:flex;flex-direction:column;gap:14px}
 .c2x{display:grid!important;grid-template-columns:1fr 1fr 1fr;align-items:start}.c2x .note{grid-column:2}.c2x .card{grid-column:3;grid-row:1}.c2x .row2{grid-column:1/4}
}</style></head><body><svg width="0" height="0" style="position:absolute"><defs>
<filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/></filter>
<filter id="sketch"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3"/></filter>
<filter id="sketchL" filterUnits="userSpaceOnUse" x="0" y="0" width="700" height="400"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3"/></filter>
